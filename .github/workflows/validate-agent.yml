name: Validate agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests psycopg[binary] flask google-genai
      - run: python -m compileall -q bot.py platform_tools.py tests
      - run: python -m unittest discover -s tests -v
