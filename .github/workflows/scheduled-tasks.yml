name: Recurring Telegram tasks

on:
  schedule:
    # GitHub Actions cron is UTC; polling every 15 minutes supports user-selected local times.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recurring-telegram-tasks
  cancel-in-progress: false

jobs:
  run-due-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: pip install -r requirements.txt
      - name: Run due tasks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scheduled_worker.py
