name: Recurring Telegram tasks

on:
  schedule:
    # GitHub Actions cron is UTC; polling every 15 minutes supports user-selected local times.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recurring-telegram-tasks
  cancel-in-progress: false

jobs:
  run-due-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check opt-in and required repository secrets
        id: check-ready
        env:
          ENABLE_RECURRING_TASKS: ${{ vars.ENABLE_RECURRING_TASKS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$ENABLE_RECURRING_TASKS" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker skipped: set Actions variable ENABLE_RECURRING_TASKS=true only after confirming the Gemini API project is Free Tier with no billing account linked."
          elif [ -z "$DATABASE_URL" ] || [ -z "$TELEGRAM_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker skipped: configure DATABASE_URL, TELEGRAM_TOKEN, and GEMINI_API_KEY in repository Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: ${{ steps.check-ready.outputs.ready == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        if: ${{ steps.check-ready.outputs.ready == 'true' }}
        run: pip install -r requirements.txt
      - name: Run due tasks
        if: ${{ steps.check-ready.outputs.ready == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scheduled_worker.py
