name: Recurring Telegram tasks

on:
  schedule:
    # GitHub Actions cron is UTC; polling every 15 minutes supports user-selected local times.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recurring-telegram-tasks
  cancel-in-progress: false

jobs:
  run-due-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check opt-in and required service configuration
        id: check-ready
        env:
          ENABLE_RECURRING_TASKS: ${{ vars.ENABLE_RECURRING_TASKS }}
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ "$ENABLE_RECURRING_TASKS" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker skipped: recurring tasks are not enabled. Set repository variable ENABLE_RECURRING_TASKS=true after confirming your Gemini project has no billing account linked."
          elif [ -z "$RENDER_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker skipped: set repository variable RENDER_URL to the existing Render service URL."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request a short-lived GitHub OIDC token
        if: ${{ steps.check-ready.outputs.ready == 'true' }}
        id: oidc
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["RENDER_URL"].rstrip("/"), safe=""))')"
          RESPONSE=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$TOKEN_URL")
          echo "token=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
      - name: Trigger the existing Render worker
        if: ${{ steps.check-ready.outputs.ready == 'true' }}
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --output /tmp/worker-response.txt --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            "$RENDER_URL/_internal/run-scheduled-tasks")
          cat /tmp/worker-response.txt
          if [ "$CODE" != "202" ] && [ "$CODE" != "409" ]; then
            echo "Render worker trigger failed with HTTP $CODE"
            exit 1
          fi
