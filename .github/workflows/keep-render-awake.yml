name: Keep Render Bot Awake

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl --fail --silent --show-error --max-time 30             https://telegram-ai-bot-57fa.onrender.com/ > /dev/null
          echo "Render bot pinged successfully."
